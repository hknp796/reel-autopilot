name: Renew Instagram token

# Instagram Login tokens expire after 60 days. This renews it on the 1st and 15th of each
# month and saves it back into the IG_ACCESS_TOKEN secret (needs the GH_PAT secret).
on:
  schedule:
    - cron: "0 4 1,15 * *"
  workflow_dispatch:

jobs:
  refresh:
    if: ${{ vars.IG_LOGIN != 'facebook' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Renew and save
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          new=$(python -m reelgen.refresh_token)
          echo "::add-mask::$new"
          printf '%s' "$new" | gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}"
