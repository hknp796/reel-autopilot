name: Publish next Reel

# Builds the oldest Reel marked "approved", serves the MP4 from this repo's GitHub Pages
# site, has Buffer post it to Instagram, then marks it "posted" in the repo.
# 13:15 UTC = 6:45 pm IST, every day. Days with nothing approved post nothing.
# GitHub can start scheduled runs a few minutes late.
on:
  schedule:
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Post this Reel id instead of the next in line (must be approved)"
        required: false
      dry_run:
        description: "Build only, don't post"
        type: boolean
        default: false

concurrency: publish
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build next approved Reel
        id: build
        env:
          REEL_ID: ${{ inputs.id }}
        shell: bash
        run: |
          args=()
          [ -n "$REEL_ID" ] && args+=(--id "$REEL_ID")
          python -m reelgen.publish build "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Host the video on GitHub Pages
        if: steps.build.outputs.reel != '' && inputs.dry_run != true
        uses: actions/configure-pages@v5
      - if: steps.build.outputs.reel != '' && inputs.dry_run != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/site
      - id: deploy
        if: steps.build.outputs.reel != '' && inputs.dry_run != true
        uses: actions/deploy-pages@v4

      - name: Post with Buffer
        if: steps.build.outputs.reel != '' && inputs.dry_run != true
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          REEL_ID: ${{ steps.build.outputs.reel }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        shell: bash
        run: python -m reelgen.publish post --id "$REEL_ID" --base-url "$PAGE_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Record what was posted
        if: always()
        shell: bash
        run: |
          if ! git diff --quiet -- reels/; then
            git config user.name "reel-autopilot"
            git config user.email "reel-autopilot@users.noreply.github.com"
            git add reels/
            git commit -m "Publish: $(git diff --cached --name-only | xargs -n1 basename | sed 's/.json//' | paste -sd, -)"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: posted-reel
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 30
